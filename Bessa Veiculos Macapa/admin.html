<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login BESSA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <img src="img/logo.png" alt="Logo bessa veiculos" class="logo-login">

    <form id="formLogin">
        <h2 style="margin-top: 0; font-size: 22px;">Acesso Restrito</h2>
        
        <label>Usuário</label>
        <input type="text" id="usuario" placeholder="Digite seu usuário">
        
        <label>Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha">
        
        <p id="msgerro" style="color: #ff0000; font-size: 14px; text-align: center; display: none; margin-bottom: 0;">Usuário ou senha inválidos.</p>
        
        
        <button type="submit">ENTRAR</button>
    </form>
    
    <script>
        const form = document.getElementById("formLogin");
        
        form.addEventListener("submit", function(evento){
            evento.preventDefault(); 
            
            const user = document.getElementById("usuario").value;
            const password = document.getElementById("senha").value;

            if (user === "admin" && password === "1234") {
                sessionStorage.setItem("logado", "true");
                window.location.href = "painel.html"; 
            } else {
                
                document.getElementById("msgerro").style.display = "block";
            }
        });
    </script>
</body>
</html>
